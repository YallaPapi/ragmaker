<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Chat - Revolutionary Experience</title>
    <link rel="stylesheet" href="css/client-chat.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app" class="app-container">
        <!-- Header -->
        <header class="chat-header">
            <div class="header-content">
                <div class="creator-info">
                    <div class="creator-avatar">
                        <img src="assets/creator-avatar.svg" alt="Creator" id="creatorAvatar">
                    </div>
                    <div class="creator-details">
                        <h1 id="creatorName">Creator's Knowledge Base</h1>
                        <p id="creatorSubtitle">Ask me anything about their content</p>
                    </div>
                </div>
                <div class="header-actions">
                    <button class="action-btn" id="historyBtn" title="Chat History">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 3v5h5M3.05 13A9 9 0 1 0 6 5.3L3 8"/>
                        </svg>
                    </button>
                    <button class="action-btn" id="settingsBtn" title="Settings">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="3"/>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1 1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                        </svg>
                    </button>
                </div>
            </div>
        </header>

        <!-- Chat Messages Container -->
        <div class="chat-container">
            <div id="messagesContainer" class="messages-container">
                <!-- Welcome message -->
                <div class="message-wrapper ai-message welcome-message">
                    <div class="message-avatar">
                        <div class="ai-avatar">AI</div>
                    </div>
                    <div class="message-content">
                        <div class="message-bubble">
                            <div class="typing-animation">
                                <span></span>
                                <span></span>
                                <span></span>
                            </div>
                            <div class="message-text" id="welcomeText">
                                Welcome! I'm your AI assistant with access to all of this creator's content. What would you like to explore today?
                            </div>
                        </div>
                        <div class="message-time">Just now</div>
                    </div>
                </div>
            </div>
            
            <!-- Typing Indicator -->
            <div id="typingIndicator" class="typing-indicator hidden">
                <div class="message-wrapper ai-message">
                    <div class="message-avatar">
                        <div class="ai-avatar pulsing">AI</div>
                    </div>
                    <div class="message-content">
                        <div class="message-bubble typing">
                            <div class="typing-dots">
                                <span></span>
                                <span></span>
                                <span></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="input-container">
            <div class="input-wrapper">
                <button class="attachment-btn" id="attachBtn" title="Attach file">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
                    </svg>
                </button>
                
                <div class="input-field-container">
                    <textarea 
                        id="messageInput" 
                        placeholder="Ask me anything about the creator's content..."
                        rows="1"
                        maxlength="2000"
                    ></textarea>
                    <div class="input-suggestions" id="inputSuggestions"></div>
                </div>
                
                <button class="send-btn" id="sendBtn" disabled title="Send message">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="22" y1="2" x2="11" y2="13"/>
                        <polygon points="22,2 15,22 11,13 2,9"/>
                    </svg>
                </button>
            </div>
            
            <div class="input-footer">
                <div class="char-counter">
                    <span id="charCount">0</span>/2000
                </div>
                <div class="quick-actions">
                    <button class="quick-action" data-suggestion="What are the main topics covered?">
                        Main Topics
                    </button>
                    <button class="quick-action" data-suggestion="Give me a summary of recent videos">
                        Recent Videos
                    </button>
                    <button class="quick-action" data-suggestion="What's the most popular content?">
                        Popular Content
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Background Elements -->
    <div class="background-elements">
        <div class="floating-particle"></div>
        <div class="floating-particle"></div>
        <div class="floating-particle"></div>
        <div class="floating-particle"></div>
        <div class="floating-particle"></div>
    </div>

    <script src="js/client-chat.js"></script>
</body>
</html>
